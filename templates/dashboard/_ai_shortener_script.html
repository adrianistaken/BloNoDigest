<script>
(() => {
  const endpoint = "{% url 'dashboard:shorten_description' %}";
  const csrfToken = document.querySelector("input[name='csrfmiddlewaretoken']")?.value;

  document.addEventListener("click", async (event) => {
      const button = event.target.closest(".js-ai-shorten");
      if (!button) return;
      // Some editors display imported source text beside (rather than inside)
      // the newsletter form. An explicit AI scope keeps both halves attached
      // to the same event without accidentally reading another open editor.
      const scope = button.closest("[data-ai-scope]") || button.closest("form") || document;
      const source = scope.querySelector(button.dataset.source);
      const target = scope.querySelector(button.dataset.target);
      const status = scope.querySelector(".js-ai-status");
      const label = button.querySelector(".js-ai-label");
      const originalLabel = label.textContent;
      const sourceText = (source?.value ?? source?.textContent ?? "").trim();

      const showStatus = (message, isError = false) => {
        status.textContent = message;
        status.classList.remove("hidden", "border-green-200", "bg-green-50", "text-green-800", "border-red-200", "bg-red-50", "text-red-700", "text-slate-500");
        if (status.classList.contains("rounded")) {
          status.classList.add(...(isError
            ? ["border-red-200", "bg-red-50", "text-red-700"]
            : ["border-green-200", "bg-green-50", "text-green-800"]));
        } else {
          status.classList.add(isError ? "text-red-700" : "text-slate-500");
        }
      };

      if (!sourceText || !target) {
        showStatus("Add a description before shortening it.", true);
        return;
      }

      button.disabled = true;
      label.textContent = "Shortening…";
      if (status) {
        status.textContent = "Creating an editable draft…";
        status.classList.remove("hidden");
      }

      try {
        const body = new FormData();
        body.append("description", sourceText);
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {"X-CSRFToken": csrfToken},
          body,
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "AI shortening failed. Try again.");

        target.value = result.description;
        target.dispatchEvent(new Event("input", {bubbles: true}));
        target.focus();
        showStatus("Draft ready. Review it, make any edits, then save changes.");
        label.textContent = "Regenerate";
      } catch (error) {
        showStatus(error.message || "AI shortening failed. Try again.", true);
        label.textContent = originalLabel;
      } finally {
        button.disabled = false;
      }
  });
})();
</script>
